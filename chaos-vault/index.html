<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=/vault/" />
  <link rel="canonical" href="/vault/" />
  <title>Chaos Vault has moved</title>
  <script>
    const destination = `/vault/${window.location.search}${window.location.hash}`;
    window.location.replace(destination);
  </script>
</head>
<body>
  <main>
    <h1>Chaos Vault has moved.</h1>
    <p><a href="/vault/">Open the short Vault URL</a></p>
  </main>
</body>
</html>
